pilot:
  name: tech-hub-cluster
  ward_kml_url: https://data.opencity.in/dataset/863209cb-4ced-4f51-b5c5-156939c50922/resource/9013d656-8051-4e2d-9648-46efd0d86d3d/download/gba-369-wards-december-2025.kml
  # Matched against the KML `ward_name` column (case-insensitive substring). The 2025 delimitation spells
  # Koramangala "Kormangala", HSR sector 2 lies in "Agara", and Domlur is "Domluru" (Domlur 2nd Stage and
  # Amarjyoti fall in the neighbouring "Kodihalli"), so patterns are listed by actual ward names.
  # Note `ward_id` repeats across corporations; wards are keyed on the KML `id2` instead.
  ward_name_patterns: ["Indiranagar", "Kormangala", "HSR Layout", "Agara", "Domluru", "Kodihalli"]
  bbox_buffer_m: 200

osm:
  overpass_urls:                  # tried in order; rotates on rate limits, timeouts and errors
    - https://overpass-api.de/api/interpreter
    - https://overpass.private.coffee/api/interpreter
    - https://overpass.kumi.systems/api/interpreter
  retry_waits_s: [15, 30, 60, 90, 120]
  user_agent: "fogfoot/0.1 (civic footpath mapping; https://github.com/N-T-SH/fogfoot)"
  cache_dir: data/osm
  timeout_s: 180

units:
  projected_crs: EPSG:32643       # UTM 43N, metres
  drop_median_side: true          # on one-way carriageways, skip the kerb facing an opposing carriageway of the same road
  median_search_m: 30
  median_min_overlap: 0.5
  median_min_antiparallel_deg: 150
  # Narrow lanes have no room for footpaths, so the two kerbs collapse into one shared-street unit
  # (side "C", on the centreline). OSM has almost no width data (0.3% of residential km), so width is
  # measured as the gap between building footprints on either side of the lane.
  shared_streets:
    enabled: true
    candidate_highway: [residential, living_street, unclassified]
    max_gap_m: 12.19            # 40 ft: median face-to-face gap between buildings; wider streets keep two kerbs
    probe_m: 15                 # how far to look for a building on each side (must exceed max_gap_m)
    sample_every_m: 8
    min_both_sides_fraction: 0.5  # samples with a building on both sides, as a share of all samples
  length_m: 100
  min_length_m: 30
  kerb_offset_by_highway:
    primary: 9
    secondary: 7
    tertiary: 5.5
    residential: 4
    unclassified: 4
    default: 4.5
  include_highway: [primary, secondary, tertiary, residential, unclassified, living_street]

capture:
  sample_every_m: 10              # ~200 frames per 2 km; governor may widen to 15 m on slow devices
  gate:
    min_sharpness: 40             # Laplacian variance on a downscaled copy; tune in Spike A
    min_mean_luma: 45
    drop_phash_dups: true
  jpeg_quality: 0.6
  max_width_px: 960               # 720p camera stream; keeps ~60-80 KB/frame
  daylight_only_default: true
  upload_wifi_only_default: true
  max_queue_mb: 300               # also capped to 40% of free quota
  low_battery_pct: 20             # warn and widen sampling
  critical_battery_pct: 10        # stop capture, save queue
  max_frame_encode_ms: 60         # governor widens sampling if exceeded
  min_gps_accuracy_m: 35          # frames above this are flagged low side_conf, not discarded
  heading_fallback: gps_course    # when DeviceOrientation unavailable or uncalibrated

app_budgets:
  initial_js_kb_gz: 150
  first_load_kb: 400
  max_features_on_screen: 3000

storage:
  sqlite_path: data/fogfoot.sqlite
  frames_dir: data/frames
  keep_raw_frames: false
  frame_retention_days: 7         # private copies in R2; public imagery lives on Mapillary

mapillary:
  push: true
  token_env: MAPILLARY_TOKEN
  organization_env: MAPILLARY_ORG_ID
  push_after: blur            # never push unblurred frames; Mapillary's blur is a second layer
  credit_contributors: false  # push under the org account; per-user credit only with explicit opt-in

maps:
  google_maps_key_env: GOOGLE_MAPS_API_KEY
