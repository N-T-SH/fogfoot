name: secret-scan
on:
  push:
    # `data` holds machine-generated OSM-derived files published by the build-units workflow.
    branches-ignore: [data]
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        # --log-opts HEAD scans the full history reachable from the commit under test, not every branch.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --log-opts="HEAD" --redact --verbose
