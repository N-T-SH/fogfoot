name: app-ci
on:
  push:
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-ci.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Enforce JS budget (150 KB gzip)
        run: |
          total=$(for f in dist/assets/*.js; do gzip -c "$f" | wc -c; done | paste -sd+ | bc)
          echo "gzip JS bytes: $total"
          test "$total" -le 153600
