name: build-units
# Downloads ward boundaries + OSM roads, builds the 100 m kerb units for the pilot wards,
# and publishes the result to the `data` branch (OSM-derived data, ODbL; see DATA_LICENSE.md).
# Run manually: Actions -> build-units -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the cached OSM download"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-units
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # only this job, only to push the `data` branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: Unit tests
        run: pytest backend -q
      - name: Build kerb units
        run: fogfoot build-units --pilot ${{ inputs.force && '--force' || '' }} | tee build-units.log
      - name: Publish to data branch
        run: |
          mkdir -p /tmp/out/osm
          cp data/units.geojson /tmp/out/
          cp data/osm/overpass_*.json /tmp/out/osm/
          gzip -9 -c data/osm/buildings_*.json > /tmp/out/osm/buildings.json.gz
          cp build-units.log /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data
          git rm -rf --quiet .
          cp -r /tmp/out/. .
          printf 'OSM-derived kerb units for the fogfoot pilot. (c) OpenStreetMap contributors, ODbL.\nGenerated by workflow build-units from commit %s.\n' "$GITHUB_SHA" > README.md
          git add -A
          git commit -q -m "kerb units from ${GITHUB_SHA::7}"
          git push -f origin data
